name: 🚀 Deploy website on push

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '19' 
        
    # Install dependencies
    - name: Install dependencies
      run: npm install

    # Build the project
    - name: Build project
      run: npm run build
      env:
        CI: false

    - name: Upload to Namecheap
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ftp.pixpal.ca
        username: web_dev@pixpal.ca
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: build/
